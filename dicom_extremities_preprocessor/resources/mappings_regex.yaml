
categories:
  bodypart:
    foot:
      - '\b(?:foot|ankle|low_exm)\b'
    hand:
      - '\b(?:hand|up_exm)\b'
    other:
      - '\b(?:cspine|vertebral column|knee|neck|pelvis|elbow|abdomen|chest|hip|lspine|shoulder|skull|tspine)\b'

  study_description_bodypart:
    hand:
      - '\bhand\b'
      - '\bhandgelenk\b'
      - '\bfinger\b'

    foot:
      - '\bfuss\b'
      - '\bvorfuss\b'
      - '\bfussgelenk\b'
      - '\bsprunggelenk\b'
      - '\bzeh\b'
      - '\bzehen\b'

    other:
      - '\bhws\b'
      - '\bbws\b'
      - '\blws\b'
      - '\bwirbelsaeule\b'
      - '\bbecken\b'
      - '\bhuefte\b'
      - '\bdexa\b'
      - '\bknie\b'
      - '\bellbogen\b'
      - '\bschulter\b'
      - '\bschaedel\b'
      - '\bthorax\b'
      - '\babdomen\b'

  laterality:
    R:
      - '^r$'
    L:
      - '^l$'

## Note that the order is important for the regex patterns when used with 
#  pp.utils.categorize_column_regex. 
# Basically: 'oblique' if 'llo|rlo'; elif 'll'  -> 'lat', ...  

  view_position_viewposition:
    oblique:
      - '^(?:llo|rlo)$'
    lat:
      - '^(?:ll|rl)$'
    dp:
      - '^(?:pa|ap)$'

  view_position_laterality:
    R:
      - '^(?:rl|rlo)$'
    L:
      - '^(?:ll|llo)$'

  series_description_bodypart:
    hand:
      - '\bhand\b'
      - '\bhandgelenk\b'
      - '\bunterarm\s*/\s*handgelenk\b'


    foot:
      - '\bfuss\b'
      - '\bvorfuss\b'
      - '\bfussgelenk\b'
      - '\bsprunggelenk\b'
      - '\bzeh\b'
      - '\bzehen\b'
      - '\bfersenbein\b'
      - '\bsesambeine\b'
      - '\bvf\s+sesambeine\b'

    other:
      - '\bhws\b'
      - '\bbws\b'
      - '\blws\b'
      - '\bknie\b'
      - '\bbecken\b'
      - '\bhuefte\b'
      - '\bdexa\b'
      - '\bfinger\b'      

  series_description_laterality:
    B:
      - '(?<!\w)vgl(?!\w)'
      - '(?<!\w)bds(?!\w)'

    R:
      - '\brechts\b'
      - '(?<!\w)re(?!\w)'
      - '(?<!\w)r(?!\w)'

    L:
      - '\blinks\b'
      - '(?<!\w)li(?!\w)'
      - '(?<!\w)l(?!\w)'

  photometric:
    MOne:
      - '^monochrome1$'
    MTwo:
      - '^monochrome2$'

  series_description_viewposition:
    oblique:
      - '\bschraeg\b'
      - '\bzither\b'
      - '\bzitherstellung\b'

    lat:
      - '\blat\b'
      - '\bseitl\b'
      - '\bseitlich\b'
      - '\bstl\b'

    dp:
      - '\bdp\b'
      - '\bdv\b'
      - '\bap\b'
      - '\bpa\b'
      - '\ba\s*p\b'
      - '\bd\s*p\b'
